<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>JOVENHUESO</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@200;300;600;700&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box}
html,body{overflow-x:hidden}
body{margin:0;background:#fff;color:#111;font-family:Archivo,'Helvetica Neue',Arial,sans-serif}
a{color:#111}a:hover{color:#555}
header{display:grid;grid-template-columns:minmax(0,1fr) auto minmax(0,1fr);align-items:center;padding:16px 32px 20px;gap:16px}
header .logo img{height:40px;width:auto;display:block}
.tools{display:flex;justify-content:flex-end;gap:4px}
.jh-icon{all:unset;box-sizing:border-box;cursor:pointer;width:44px;height:44px;display:flex;align-items:center;justify-content:center;color:#111;transition:background .15s}
.jh-icon:hover{background:#F2F2F2}
.jh-icon:focus-visible{outline:2px solid #111;outline-offset:2px}
.jh-icon svg{transition:transform .6s cubic-bezier(.2,.7,.2,1)}
.jh-on,.jh-on:hover{background:#F7941D}
.jh-on svg{transform:rotate(180deg)}
:root{--gap:9px;--piz:clamp(220px,20vw,360px)}
main{width:100%;margin:0;padding:8px var(--gap) 96px calc(var(--piz) + 2 * var(--gap))}
.jh-board{position:relative}
.jh-grid{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));grid-auto-rows:90px;gap:var(--gap)}
.jh-card{all:unset;box-sizing:border-box;display:block;position:relative;cursor:grab;perspective:2000px;min-width:0;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none}
.jh-card:focus-visible{outline:2px solid #111;outline-offset:3px}
.jh-inner{position:relative;width:100%;height:100%;transform-style:preserve-3d;transition:transform .8s cubic-bezier(.2,.7,.2,1)}
.jh-flipped .jh-inner{transform:rotateY(180deg)}
.jh-face{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;background:#fff;border:1px solid #C8C8C8;display:flex;flex-direction:column;padding:7px 9px 10px;transition:border-color .2s}
.jh-back{transform:rotateY(180deg)}
.jh-card:hover .jh-face{border-color:#111}
.jh-cap{font-size:7px;line-height:1.2;letter-spacing:.03em;text-transform:uppercase;color:#3A3A3A;font-weight:200;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.jh-cap b{font-weight:700;color:#111}
.jh-img{position:absolute;inset:0;display:flex;align-items:center;justify-content:center}
.jh-img img{max-width:100%;max-height:100%;object-fit:contain;display:block;pointer-events:none;user-select:none}
.jh-face .jh-cap{position:relative;z-index:1}
.jh-pizarra{position:fixed;z-index:1;box-sizing:border-box;border:1px solid #C8C8C8;background:#fff;padding:7px 9px;pointer-events:none;display:none}
.jh-pizarra.on{display:block}
.jh-empty .jh-inner{visibility:hidden}
.jh-dot{position:absolute;top:9px;right:9px;width:6px;height:6px;border-radius:50%;background:#F7941D;z-index:2;display:none}
.jh-incart .jh-face .jh-dot{display:block}
#cartBtn svg path{transition:fill .3s ease,stroke .3s ease}
#cartBtn.full svg path{fill:#F7941D;stroke:#F7941D}
#cartBtn.full svg path + path{fill:none}
#cartBtn.pop svg{animation:jhPop .45s cubic-bezier(.2,.7,.2,1)}
@keyframes jhPop{0%{transform:scale(1)}40%{transform:scale(1.25)}100%{transform:scale(1)}}
.jh-empty{cursor:default}
.jh-loose{all:unset;position:fixed;box-sizing:border-box;cursor:grab;perspective:2000px;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none}
.jh-loose .jh-face{border:none;background:transparent;padding:0}
.jh-loose .jh-img{padding:0}
.jh-loose:focus-visible{outline:1px dashed #9A9A9A;outline-offset:4px}
.jh-lifted{cursor:grabbing}
.jh-lifted .jh-img img{filter:drop-shadow(0 12px 16px rgba(0,0,0,.16))}
footer{padding:20px 32px 28px;display:flex;justify-content:center;gap:28px;flex-wrap:wrap;font-size:9px;letter-spacing:.14em;font-weight:300}
footer a{text-decoration:none}
.jh-ov{position:fixed;inset:0;z-index:50;background:#fff;display:none;flex-direction:column;overflow-y:auto;animation:jhFade .25s ease}
.jh-ov.open{display:flex}
.jh-ov-top{display:grid;grid-template-columns:minmax(0,1fr) auto minmax(0,1fr);align-items:center;padding:16px 32px 20px}
.jh-ov-top img{height:40px;width:auto;display:block}
.jh-ov-stage{flex-grow:1;display:flex;align-items:center;justify-content:center;gap:16px;padding:0 16px;min-height:420px}
.jh-ov-box{display:flex;align-items:center;justify-content:center;width:min(62vw,640px);height:min(62vh,620px)}
.jh-ov-box.wide{width:min(84vw,1180px)}
.jh-ov-box.tall{height:min(66vh,860px)}
.jh-ov-box img{max-width:100%;max-height:100%;object-fit:contain;display:block;animation:jhZoom .45s cubic-bezier(.2,.7,.2,1)}
.jh-ov-info{display:flex;flex-direction:column;align-items:center;gap:10px;padding:24px 24px 48px;text-align:center}
.jh-count{font-size:9px;letter-spacing:.14em;color:#555;font-weight:300}
.jh-arrow{all:unset;cursor:pointer;width:56px;height:56px;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.jh-arrow:hover{background:#F2F2F2}
.jh-arrow:focus-visible{outline:2px solid #111}
.jh-arrow[hidden]{display:none}
.jh-wa{display:inline-flex;align-items:center;justify-content:center;min-height:48px;padding:0 28px;margin-top:12px;background:#111;color:#fff;text-decoration:none;font-weight:600;font-size:10px;letter-spacing:.14em}
.jh-wa:hover{background:#F7941D;color:#111}
.jh-icon{position:relative}
.jh-badge{position:absolute;top:6px;right:5px;min-width:15px;height:15px;padding:0 4px;box-sizing:border-box;border-radius:8px;background:#111;color:#fff;font-size:9px;font-weight:600;line-height:15px;text-align:center;display:none}
.jh-badge.on{display:block}
.jh-actions{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;margin-top:12px}
.jh-actions .jh-wa{margin-top:0}
.jh-add{display:inline-flex;align-items:center;justify-content:center;min-height:48px;padding:0 28px;background:#fff;color:#111;border:1px solid #111;cursor:pointer;font:inherit;font-weight:600;font-size:10px;letter-spacing:.14em}
.jh-add:hover{background:#111;color:#fff}
.jh-add.in{border-color:#C8C8C8;color:#555}
.jh-add.in:hover{background:#fff;color:#111;border-color:#111}
.jh-add:focus-visible{outline:2px solid #111;outline-offset:2px}
.jh-cart-bg{position:fixed;inset:0;z-index:60;background:rgba(255,255,255,.6);display:none}
.jh-cart-bg.open{display:block}
.jh-cart{position:fixed;top:0;right:0;bottom:0;z-index:61;width:min(380px,100vw);background:#fff;border-left:1px solid #C8C8C8;display:flex;flex-direction:column;transform:translateX(100%);transition:transform .35s cubic-bezier(.2,.7,.2,1);visibility:hidden}
.jh-cart.open{transform:none;visibility:visible}
.jh-cart-head{display:flex;justify-content:space-between;align-items:center;padding:14px 12px 14px 20px;border-bottom:1px solid #C8C8C8}
.jh-cart-list{flex:1;overflow-y:auto;padding:8px 20px;margin:0;list-style:none}
.jh-cart-list li{display:grid;grid-template-columns:64px 1fr auto;gap:14px;align-items:center;padding:12px 0;border-bottom:1px solid #EDEDED}
.jh-cart-list .th{width:64px;height:64px;border:1px solid #E2E2E2;display:flex;align-items:center;justify-content:center}
.jh-cart-list .th img{max-width:80%;max-height:80%;object-fit:contain}
.jh-cart-list .nm{display:flex;flex-direction:column;gap:4px;min-width:0}
.jh-cart-list .nm .jh-cap{font-size:9px;white-space:normal}
.jh-cart-list .pr{font-size:10px;letter-spacing:.08em;font-weight:300}
.jh-x{all:unset;cursor:pointer;width:32px;height:32px;display:flex;align-items:center;justify-content:center}
.jh-x:hover{background:#F2F2F2}
.jh-x:focus-visible{outline:2px solid #111}
.jh-cart-empty{padding:40px 20px;font-size:10px;letter-spacing:.12em;color:#555;font-weight:300;text-align:center}
.jh-cart-foot{padding:16px 20px 22px;border-top:1px solid #C8C8C8;display:flex;flex-direction:column;gap:10px}
.jh-cart-foot .jh-wa{margin-top:0;width:100%;box-sizing:border-box}
.jh-cart-foot .jh-wa[aria-disabled="true"]{background:#C8C8C8;pointer-events:none}
.jh-cart-note{font-size:9px;letter-spacing:.1em;color:#555;font-weight:300;text-align:center}
@keyframes jhFade{from{opacity:0}to{opacity:1}}
@keyframes jhZoom{from{transform:scale(.82);opacity:0}to{transform:scale(1);opacity:1}}
@media (max-width:820px){
header,main,footer{padding-left:16px;padding-right:16px}
main{padding-left:16px}
.jh-grid{grid-template-columns:repeat(6,minmax(0,1fr));grid-auto-rows:58px;gap:8px}
.jh-ov-box,.jh-ov-box.wide{width:calc(100vw - 140px)}
}
</style>
</head>

var DEFAULT_ORDER = ['vincha','chombablanca','jean34','bolso','remeceleste','blanco34','gafas','chombaark','tabisblancas','puffer','capucha','kioto','pant','canilleras','bandolera','tabisnegras','muscuroja','boina','fleece','revista','muscunegra','zoom','muscunaranja','remegris','inter','pollera'];
// cada vez que se carga la página se arma una grilla nueva al azar, mezclando tipos de prenda y sin huecos
var CAT = {fleece:'out',puffer:'out',bandolera:'acc',vincha:'acc',boina:'acc',canilleras:'acc',gafas:'acc',bolso:'acc',revista:'rev',blanco34:'bot',pant:'bot',jean34:'bot',pollera:'bot',zoom:'shoe',kioto:'shoe',tabisblancas:'shoe',tabisnegras:'shoe'};
function randomOrder(cols) {
var ids = DEFAULT_ORDER.slice(), area = 0;
ids.forEach(function (i) { area += BY[i].w * BY[i].h; });
var rows = Math.ceil(area / cols);
var cat = function (i) { return CAT[i] || 'top'; };
for (var attempt = 0; attempt < 600; attempt++) {
var g = {}, order = [], rem = ids.slice(), steps = 0;
var free = function (r, c) { return c < cols && r < rows && !g[r * 64 + c]; };
var first = function () { for (var r = 0; r < rows; r++) for (var c = 0; c < cols; c++) if (!g[r * 64 + c]) return [r, c]; return null; };
var dfs = function () {
if (++steps > 300) return false;
if (!rem.length) return true;
var f = first(), r = f[0], c = f[1], run = 0;
while (c + run < cols && free(r, c + run)) run++;
if (run < 2) return false;
var last = order.slice(-2).map(cat);
var cands = rem.map(function (i) { return [i, (last.indexOf(cat(i)) >= 0 ? 1 : 0) + Math.random() * 0.8]; }).sort(function (a, b) { return a[1] - b[1]; });
for (var n = 0; n < cands.length; n++) {
var id = cands[n][0], w = BY[id].w, h = BY[id].h, x, y, ok = true;
if (w > run || r + h > rows || run - w === 1) continue;
for (y = 0; y < h && ok; y++) for (x = 0; x < w; x++) if (!free(r + y, c + x)) { ok = false; break; }
if (!ok) continue;
for (y = 0; y < h; y++) for (x = 0; x < w; x++) g[(r + y) * 64 + c + x] = id;
order.push(id); rem.splice(rem.indexOf(id), 1);
if (dfs()) return true;
order.pop(); rem.push(id);
for (y = 0; y < h; y++) for (x = 0; x < w; x++) delete g[(r + y) * 64 + c + x];
}
return false;
};
if (dfs()) return order;
}
return null;
}
var ORDER = randomOrder(12) || DEFAULT_ORDER;

var board = document.getElementById('board'), grid = document.getElementById('grid');
var flipped = false, cols = 0, z = 10, free = {}, cards = {}, loose = {};
function waLink(msg) { return 'https://wa.me/' + WHATSAPP + '?text=' + encodeURIComponent(msg); }
document.getElementById('waFooter').href = waLink('Hola JOVENHUESO! Quiero consultar por las prendas del catálogo.');
function esc(t) { return String(t).replace(/[&<>"]/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]; }); }
function cap(x) { return esc(x.name) + ' by <b>' + esc(x.brand) + '</b>'; }

// ---- grilla: cada recuadro va al primer lugar donde entra
function mobileW(w) { return w >= 4 ? 6 : w === 3 ? 3 : 2; }
function pack(cols) {
var taken = {}, pl = {};
ORDER.forEach(function (id) {
var it = BY[id], w = Math.min(cols, cols === 12 ? it.w : mobileW(it.w)), h = it.h, r = 0, c, found = false;
function fits(r, c) { if (c + w > cols) return false; for (var i = 0; i < h; i++) for (var k = 0; k < w; k++) if (taken[(r + i) * 64 + c + k]) return false; return true; }
while (!found) { for (c = 0; c <= cols - w; c++) { if (fits(r, c)) { found = true; break; } } if (!found) r++; }
pl[id] = { r: r, c: c, w: w, h: h };
for (var i = 0; i < h; i++) for (var k = 0; k < w; k++) taken[(r + i) * 64 + c + k] = 1;
});
return pl;
}
ORDER.forEach(function (id, i) {
var x = BY[id];
var el = document.createElement('button');
el.type = 'button'; el.className = 'jh-card'; el.setAttribute('data-jh-id', id); el.setAttribute('aria-label', x.name + ' by ' + x.brand);
el.innerHTML = '<div class="jh-inner" style="transition-delay:' + (i * 0.025).toFixed(3) + 's">' +
'<div class="jh-face"><span class="jh-dot"></span><span class="jh-cap">' + cap(x) + '</span><div class="jh-img"><img src="' + x.f + '" alt="" draggable="false"></div></div>' +
'<div class="jh-face jh-back"><span class="jh-dot"></span><span class="jh-cap">' + cap(x) + '</span><div class="jh-img"><img src="' + (x.b || x.f) + '" alt="" draggable="false"></div></div></div>';
el.addEventListener('click', function (e) { if (e.detail === 0) openItem(id); });
grid.appendChild(el); cards[id] = el;
});
function layout() {
var nc = window.innerWidth <= 820 ? 6 : 12;
if (nc === cols) return;
cols = nc; clearLoose(false);
var pl = pack(cols);
ORDER.forEach(function (id) { var p = pl[id]; cards[id].style.gridColumn = (p.c + 1) + ' / span ' + p.w; cards[id].style.gridRow = (p.r + 1) + ' / span ' + p.h; });
}
// pizarras "Armá tu look": ocupan las bandas blancas a los costados de la grilla
var pizL = document.getElementById('pizL');
var GAP = 9; // la misma separación que entre recuadros
function placePizarras() {
var br = board.getBoundingClientRect(), vh = window.innerHeight;
var show = cols === 12;
pizL.classList.toggle('on', show);
if (!show) return;
pizL.style.top = Math.max(GAP, br.top) + 'px'; pizL.style.bottom = Math.max(GAP, vh - br.bottom) + 'px';
pizL.style.left = GAP + 'px'; pizL.style.width = (br.left - 2 * GAP) + 'px';
}
window.addEventListener('scroll', placePizarras, { passive: true });
function setRows() {
// recuadros cuadrados: el alto de cada fila es igual al ancho de una columna
if (cols !== 12) { grid.style.gridAutoRows = ''; return; }
grid.style.gridAutoRows = ((grid.clientWidth - 11 * GAP) / 12) + 'px';
}
window.addEventListener('resize', function () { layout(); setRows(); placePizarras(); applyScale(); });

// ---- escala real: la campera puffer ocupa el 76% del ancho de su recuadro y el resto se ajusta a esa escala
function applyScale() {
var pf = cards.puffer; if (!pf) return;
var k = 0.76 * pf.clientWidth / REAL.puffer; // px por cm
ORDER.forEach(function (id) {
var x = BY[id], card = cards[id];
var fd = DIMS[x.f]; if (!fd) return;
var s = REAL[id] * k / Math.max(fd[0], fd[1]); // px por pixel de la foto
var maxW = card.clientWidth * 0.84, maxH = card.clientHeight * 0.80;
card.querySelectorAll('.jh-img img').forEach(function (im) {
var d = DIMS[im.getAttribute('src')] || fd;
var w = d[0] * s, h = d[1] * s, fit = Math.min(1, maxW / w, maxH / h);
im.style.width = (w * fit) + 'px'; im.style.height = (h * fit) + 'px';
});
});
}

// ---- dar vuelta
var flipBtn = document.getElementById('flipBtn');
flipBtn.addEventListener('click', function () {
flipped = !flipped; board.classList.toggle('jh-flipped', flipped);
flipBtn.classList.toggle('jh-on', flipped); flipBtn.setAttribute('aria-pressed', flipped ? 'true' : 'false');
});

// ---- máscaras de transparencia (para agarrar la ficha de abajo al tocar una zona vacía)
var MASKS = {};
function loadMask(url) {
if (MASKS[url]) return; MASKS[url] = { ready: false };
var img = new Image();
img.onload = function () {
try {
var sc = Math.min(1, 160 / Math.max(img.naturalWidth, img.naturalHeight));
var w = Math.max(1, Math.round(img.naturalWidth * sc)), h = Math.max(1, Math.round(img.naturalHeight * sc));
var cv = document.createElement('canvas'); cv.width = w; cv.height = h;
var cx = cv.getContext('2d'); cx.drawImage(img, 0, 0, w, h);
MASKS[url] = { ready: true, w: w, h: h, data: cx.getImageData(0, 0, w, h).data };
} catch (err) { MASKS[url] = { ready: false }; }
};
img.src = url;
}
function opaqueAt(el, x, y) {
var im = el.querySelector(flipped ? '.jh-back img' : '.jh-face:not(.jh-back) img');
if (!im) return true;
var r = im.getBoundingClientRect();
if (x < r.left || x > r.right || y < r.top || y > r.bottom) return false;
var m = MASKS[im.getAttribute('src')];
if (!m || !m.ready) return true;
var px = Math.min(m.w - 1, Math.floor((x - r.left) / r.width * m.w)), py = Math.min(m.h - 1, Math.floor((y - r.top) / r.height * m.h));
return m.data[(py * m.w + px) * 4 + 3] > 40;
}
function hitTest(x, y) {
var list = document.elementsFromPoint(x, y);
for (var i = 0; i < list.length; i++) {
var el = list[i].closest && list[i].closest('[data-jh-id]');
if (!el || el.classList.contains('jh-empty')) continue;
if (el.classList.contains('jh-loose')) { if (opaqueAt(el, x, y)) return el; continue; }
return el;
}
return null;
}

// ---- mesa de trabajo
function makeLoose(id, rect) {
var x = BY[id], br = board.getBoundingClientRect();
var el = document.createElement('button');
el.type = 'button'; el.className = 'jh-loose'; el.setAttribute('data-jh-id', id); el.setAttribute('aria-label', x.name + ' by ' + x.brand);
el.innerHTML = '<div class="jh-inner"><div class="jh-face"><div class="jh-img"><img src="' + x.f + '" alt="" draggable="false"></div></div>' +
'<div class="jh-face jh-back"><div class="jh-img"><img src="' + (x.b || x.f) + '" alt="" draggable="false"></div></div></div>';
el.addEventListener('click', function (e) { if (e.detail === 0) openItem(id); });
free[id] = { x: rect.left, y: rect.top, w: rect.width, h: rect.height };
el.style.left = free[id].x + 'px'; el.style.top = free[id].y + 'px'; el.style.width = rect.width + 'px'; el.style.height = rect.height + 'px';
board.appendChild(el); loose[id] = el;
cards[id].classList.add('jh-empty'); cards[id].tabIndex = -1;
loadMask(x.f); if (x.b) loadMask(x.b);
return el;
}
function clearLoose(animate) {
Object.keys(loose).forEach(function (id) {
var el = loose[id], card = cards[id];
var from = el.getBoundingClientRect();
el.remove(); delete loose[id]; delete free[id];
card.classList.remove('jh-empty'); card.tabIndex = 0;
if (animate && card.animate) {
var im = card.querySelector(flipped && BY[id].b ? '.jh-back img' : '.jh-face:not(.jh-back) img');
var to = im.getBoundingClientRect();
card.animate([{ transform: 'translate(' + (from.left - to.left) + 'px,' + (from.top - to.top) + 'px)' }, { transform: 'translate(0,0)' }], { duration: 520, easing: 'cubic-bezier(.2,.7,.2,1)' });
}
});
}
document.getElementById('resetBtn').addEventListener('click', function () { clearLoose(true); });

var p = null, holdTimer = null;
board.addEventListener('pointerdown', function (e) {
if (e.button !== 0) return;
var el = hitTest(e.clientX, e.clientY);
if (!el) return;
p = { id: el.getAttribute('data-jh-id'), el: el, x0: e.clientX, y0: e.clientY, active: false, touch: e.pointerType === 'touch' };
clearTimeout(holdTimer);
if (p.touch) holdTimer = setTimeout(function () { if (p && !p.cancelled) lift(p.x0, p.y0); }, 320);
});
function lift(x, y) {
var el;
if (p.el.classList.contains('jh-loose')) el = p.el;
else {
var im = p.el.querySelector(flipped && BY[p.id].b ? '.jh-back img' : '.jh-face:not(.jh-back) img');
el = makeLoose(p.id, im.getBoundingClientRect());
}
var r = el.getBoundingClientRect();
p.dx = x - r.left; p.dy = y - r.top; p.active = true; p.loose = el;
el.style.zIndex = ++z; el.classList.add('jh-lifted');
}
window.addEventListener('pointermove', function (e) {
if (!p) return;
if (!p.active) {
var dist = Math.abs(e.clientX - p.x0) + Math.abs(e.clientY - p.y0);
if (p.touch) { if (dist > 10) { p.cancelled = true; clearTimeout(holdTimer); } return; }
if (dist < 5) return;
lift(p.x0, p.y0);
}
var f = free[p.id];
// la ficha se mueve por toda la pantalla y queda fija mientras se scrollea
var vw = document.documentElement.clientWidth, vh = window.innerHeight;
var nx = Math.max(-f.w * 0.6, Math.min(vw - f.w * 0.4, e.clientX - p.dx));
var ny = Math.max(-f.h * 0.3, Math.min(vh - f.h * 0.5, e.clientY - p.dy));
f.x = nx; f.y = ny; p.loose.style.left = nx + 'px'; p.loose.style.top = ny + 'px';
});
window.addEventListener('touchmove', function (e) { if (p && p.active) e.preventDefault(); }, { passive: false });
function up() {
clearTimeout(holdTimer);
if (!p) return;
var q = p; p = null;
if (q.active) { q.loose.classList.remove('jh-lifted'); return; }
if (!q.cancelled) openItem(q.id);
}
window.addEventListener('pointerup', up);
window.addEventListener('pointercancel', up);

// ---- vista de prenda
var ov = document.getElementById('ov'), ovBox = document.getElementById('ovBox'), cur = null, side = 0;
function renderOv() {
var x = BY[cur], imgs = x.pages || (x.b ? [x.f, x.b] : [x.f]), n = imgs.length, k = ((side % n) + n) % n;
ovBox.className = 'jh-ov-box' + (x.revista ? ' tall' : '') + (x.revista && k > 0 ? ' wide' : '');
ovBox.innerHTML = '<img src="' + imgs[k] + '" alt="' + esc(x.name + ' by ' + x.brand) + '">';
document.getElementById('ovPrev').hidden = n < 2; document.getElementById('ovNext').hidden = n < 2;
var pad = function (v) { return (v < 10 ? '0' : '') + v; };
document.getElementById('ovCount').textContent = x.revista ? pad(k + 1) + ' / ' + pad(n) : '';
document.getElementById('ovName').innerHTML = cap(x);
document.getElementById('ovPrice').textContent = x.price;
document.getElementById('ovDetail').textContent = x.revista ? 'FORMATO ' + x.size + ' · EDICIÓN IMPRESA' : 'TALLE ' + x.size + ' · PIEZA ÚNICA';
document.getElementById('ovWa').href = waLink('Hola JOVENHUESO! Me interesa ' + x.name + ' by ' + x.brand + '. ¿Sigue disponible?');
ov.setAttribute('aria-label', x.name + ' by ' + x.brand);
syncAddBtn();
}
function openItem(id) { cur = id; side = 0; renderOv(); ov.classList.add('open'); document.getElementById('ovClose').focus(); }
document.getElementById('ovClose').addEventListener('click', function () { ov.classList.remove('open'); if (cards[cur]) cards[cur].focus(); });
document.getElementById('ovPrev').addEventListener('click', function () { side--; renderOv(); });
document.getElementById('ovNext').addEventListener('click', function () { side++; renderOv(); });

// ---- carrito: se guarda en este navegador, para no perderlo al recargar
var cart = [];
try { cart = JSON.parse(localStorage.getItem('jh-cart') || '[]').filter(function (id) { return BY[id]; }); } catch (err) { cart = []; }
function saveCart() { try { localStorage.setItem('jh-cart', JSON.stringify(cart)); } catch (err) {} }
var cartEl = document.getElementById('cart'), cartBg = document.getElementById('cartBg');
function markCart() {
// puntito naranja en el recuadro de las prendas que están en el carrito
ORDER.forEach(function (id) { cards[id].classList.toggle('jh-incart', cart.indexOf(id) >= 0); });
document.getElementById('cartBtn').classList.toggle('full', cart.length > 0);
}
function renderCart() {
markCart();
var n = cart.length, badge = document.getElementById('cartCount');
badge.textContent = n; badge.classList.toggle('on', n > 0);
document.getElementById('cartBtn').setAttribute('aria-label', 'Abrir carrito (' + n + (n === 1 ? ' prenda)' : ' prendas)'));
document.getElementById('cartTitleCount').textContent = n ? '(' + n + ')' : '';
var list = document.getElementById('cartList');
if (!n) { list.innerHTML = '<li class="jh-cart-empty" style="display:block;border:0">TU CARRITO ESTÁ VACÍO.<br><br>ABRÍ UNA PRENDA Y TOCÁ “AGREGAR AL CARRITO”.</li>'; }
else list.innerHTML = cart.map(function (id) {
var x = BY[id];
return '<li><div class="th"><img src="' + x.f + '" alt=""></div><div class="nm"><span class="jh-cap">' + cap(x) + '</span><span class="pr">' + esc(x.price) + '</span></div>' +
'<button type="button" class="jh-x" data-rm="' + id + '" aria-label="Quitar ' + esc(x.name + ' by ' + x.brand) + ' del carrito"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#111" stroke-width="1.4" aria-hidden="true"><path d="M5 5l14 14M19 5L5 19"/></svg></button></li>';
}).join('');
var wa = document.getElementById('cartWa');
if (n) {
var msg = 'Hola JOVENHUESO! Me interesan estas prendas, ¿siguen disponibles?\n' + cart.map(function (id) { var x = BY[id]; return '- ' + x.name + ' by ' + x.brand; }).join('\n');
wa.href = waLink(msg); wa.removeAttribute('aria-disabled'); wa.removeAttribute('tabindex');
} else { wa.href = '#'; wa.setAttribute('aria-disabled', 'true'); wa.setAttribute('tabindex', '-1'); }
if (cur) syncAddBtn();
}
function syncAddBtn() {
var b = document.getElementById('ovAdd'), inCart = cart.indexOf(cur) >= 0;
b.classList.toggle('in', inCart);
b.textContent = inCart ? 'EN EL CARRITO ✓  QUITAR' : 'AGREGAR AL CARRITO';
}
document.getElementById('ovAdd').addEventListener('click', function () {
var i = cart.indexOf(cur);
if (i >= 0) cart.splice(i, 1); else cart.push(cur);
saveCart(); renderCart();
if (i < 0) { var cb = document.getElementById('cartBtn'); cb.classList.remove('pop'); void cb.offsetWidth; cb.classList.add('pop'); }
});
document.getElementById('cartList').addEventListener('click', function (e) {
var b = e.target.closest('[data-rm]'); if (!b) return;
cart.splice(cart.indexOf(b.getAttribute('data-rm')), 1); saveCart(); renderCart();
});
function openCart() { renderCart(); cartEl.classList.add('open'); cartBg.classList.add('open'); document.getElementById('cartClose').focus(); }
function closeCart() { cartEl.classList.remove('open'); cartBg.classList.remove('open'); document.getElementById('cartBtn').focus(); }
document.getElementById('cartBtn').addEventListener('click', openCart);
document.getElementById('cartClose').addEventListener('click', closeCart);
cartBg.addEventListener('click', closeCart);
document.addEventListener('keydown', function (e) {
if (e.key !== 'Escape') return;
if (cartEl.classList.contains('open')) closeCart();
else if (ov.classList.contains('open')) document.getElementById('ovClose').click();
});
renderCart();

layout();
setRows();
placePizarras();
applyScale();
})();
</script>
</body>
</html>
