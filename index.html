<style>
*{box-sizing:border-box}
html,body{overflow-x:hidden}
body{margin:0;background:#fff;color:#111;font-family:Archivo,'Helvetica Neue',Arial,sans-serif}
a{color:#111}a:hover{color:#555}
.jh-hero{position:relative;height:100vh;height:100svh;overflow:hidden;background:#fff}
.jh-hero-logo{position:absolute;top:16px;left:50%;transform:translateX(-50%);z-index:2}
.jh-hero-logo img,header .logo img{height:32px;width:auto;display:block}

.jh-hero-track{position:absolute;inset:0;display:flex;will-change:transform;cursor:grab;touch-action:pan-y;user-select:none;-webkit-user-select:none}
.jh-hero-track.drag{cursor:grabbing}
.jh-hero-slide{flex:0 0 100%;height:100%;display:flex;align-items:center;justify-content:center}
.jh-hero-img{width:min(40vw,78svh);height:auto;display:block;user-select:none;-webkit-user-drag:none;pointer-events:none}
.jh-hero-down{position:absolute;left:50%;bottom:22px;transform:translateX(-50%);width:54px;height:54px;border:0;background:none;padding:0;cursor:pointer;color:#111;display:flex;align-items:center;justify-content:center;animation:jhBob 2.2s ease-in-out infinite}
.jh-hero-down svg{width:26px;height:26px}
@keyframes jhBob{0%,100%{transform:translate(-50%,0)}50%{transform:translate(-50%,7px)}}
@media (max-width:820px){.jh-hero-img{width:min(74vw,78svh)}}
body.is-mobile.on-hero .jh-tray{transform:translateY(100%)}
body.is-mobile .jh-tray{transition:height .35s cubic-bezier(.2,.7,.2,1),transform .35s ease}
header{display:grid;grid-template-columns:minmax(0,1fr) auto minmax(0,1fr);align-items:center;padding:16px 32px 20px;gap:16px}
header .logo img{height:40px;width:auto;display:block}
.tools{display:flex;justify-content:flex-end;gap:4px}
.jh-icon{all:unset;box-sizing:border-box;cursor:pointer;width:50px;height:50px;display:flex;align-items:center;justify-content:center;color:#111;transition:background .15s}
.jh-icon:hover{background:#F2F2F2}
.jh-icon:focus-visible{outline:2px solid #111;outline-offset:2px}
.jh-icon svg{transition:transform .6s cubic-bezier(.2,.7,.2,1)}
.jh-on,.jh-on:hover{background:#F7941D}
.jh-on svg{transform:rotate(180deg)}
.jh-snd-on,.jh-snd-on:hover{background:#F7941D}
#soundBtn .w{transition:opacity .25s}
#soundBtn:not(.jh-snd-on) .w{opacity:0}
#soundBtn.jh-snd-on .x{opacity:0}
:root{--gap:9px;--piz:clamp(240px,21vw,420px)}
main{width:100%;margin:0;padding:8px var(--gap) 96px calc(var(--piz) + 2 * var(--gap))}
.jh-board{position:relative}
.jh-grid{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));grid-auto-rows:90px;gap:var(--gap)}
.jh-card{all:unset;box-sizing:border-box;display:block;position:relative;cursor:grab;perspective:2000px;min-width:0;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none}
.jh-card:focus-visible{outline:2px solid #111;outline-offset:3px}
.jh-inner{position:relative;width:100%;height:100%;transform-style:preserve-3d;transition:transform .8s cubic-bezier(.45,.05,.55,.95);transition-delay:var(--d,0s)}
.jh-flipped .jh-inner{transform:rotateY(180deg)}
.jh-face{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;background:#fff;border:1px solid #C8C8C8;display:flex;flex-direction:column;padding:7px 9px 10px;transition:border-color .2s}
.jh-back{transform:rotateY(180deg)}
/* algunos celulares (sobre todo iPhone) no esconden bien la cara de atrás al girar: se oculta explícitamente a mitad del giro */
.jh-face{transition:border-color .2s,visibility 0s linear calc(var(--d,0s) + .4s)}
.jh-back{visibility:hidden}
.jh-flipped .jh-back{visibility:visible}
.jh-flipped .jh-face:not(.jh-back){visibility:hidden}
.jh-empty .jh-face{visibility:hidden!important;transition:none!important} /* al levantar una prenda, el recuadro se vacía al instante (sin la demora del giro) */
/* al volver a su lugar la cara aparece al instante (sin la demora del giro, que la dejaba invisible casi un segundo) */
.jh-arrive .jh-face{transition:border-color .2s!important}
.jh-card:hover .jh-face{border-color:#111}
.jh-cap{font-size:7px;line-height:1.2;letter-spacing:.03em;text-transform:uppercase;color:#3A3A3A;font-weight:200;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.jh-cap b{font-weight:700;color:#111}
.jh-img{position:absolute;inset:0;display:flex;align-items:center;justify-content:center}
.jh-img img{max-width:100%;max-height:100%;object-fit:contain;display:block;pointer-events:none;user-select:none}
.jh-face .jh-cap{position:relative;z-index:1}
.jh-pizarra{position:fixed;z-index:1;box-sizing:border-box;border:1px solid #C8C8C8;background:#fff;padding:7px 9px;pointer-events:none;display:none}
.jh-pizarra.on{display:block}
.jh-pizarra .jh-tray-actions{display:flex;position:absolute;left:9px;right:9px;bottom:38px;padding:0;pointer-events:auto;background:#fff;opacity:0;visibility:hidden;transform:translateY(10px);transition:opacity .25s ease,transform .25s ease,visibility .25s}
.jh-pizarra.menu-open .jh-tray-actions{opacity:1;visibility:visible;transform:none}
.jh-pizarra.menu-open{background:transparent}
.jh-pizarra.menu-open .jh-tray-actions{box-shadow:0 -12px 0 12px #fff}
.jh-piz-toggle{all:unset;position:absolute;left:50%;bottom:4px;transform:translateX(-50%);width:54px;height:34px;display:flex;align-items:center;justify-content:center;cursor:pointer;pointer-events:auto;color:#111}
.jh-piz-toggle:hover{background:#F2F2F2}
.jh-piz-toggle:focus-visible{outline:2px solid #111}
.jh-piz-toggle svg{transition:transform .25s ease}
.jh-pizarra.menu-open .jh-piz-toggle svg{transform:rotate(180deg)}
.jh-pizarra .jh-tray-actions .jh-wa,.jh-pizarra .jh-tray-actions .jh-add{min-height:40px;font-size:9px;padding:0 10px}
.jh-pizarra .jh-tray-hint{top:40%}
.jh-empty .jh-inner{visibility:hidden}
.jh-dot{position:absolute;top:9px;right:9px;width:6px;height:6px;border-radius:50%;background:#F7941D;z-index:2;display:none}
.jh-incart .jh-face .jh-dot{display:block}
#cartBtn svg path{transition:fill .3s ease,stroke .3s ease}
#cartBtn.full svg path{fill:#F7941D;stroke:#F7941D}
#cartBtn.full svg path + path{fill:none}
#cartBtn.pop svg{animation:jhPop .45s cubic-bezier(.2,.7,.2,1)}
@keyframes jhPop{0%{transform:scale(1)}40%{transform:scale(1.25)}100%{transform:scale(1)}}
.jh-empty{cursor:default}
.jh-empty.jh-home{outline:1px dashed #BDBDBD;outline-offset:-1px;transition:outline-color .15s,background .15s}
.jh-empty.jh-home.hot{outline:1px solid #111;background:#FAFAFA}
.jh-loose{all:unset;position:fixed;touch-action:none;box-sizing:border-box;cursor:grab;perspective:2000px;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none}
.jh-loose .jh-face{border:none;background:transparent;padding:0}
.jh-loose .jh-img{padding:0}
.jh-loose:focus-visible{outline:1px dashed #9A9A9A;outline-offset:4px}
.jh-lifted{cursor:grabbing}
.jh-lifted .jh-img img{filter:drop-shadow(0 12px 16px rgba(0,0,0,.16))}
footer{padding:20px 32px 28px;display:flex;justify-content:center;gap:28px;flex-wrap:wrap;font-size:9px;letter-spacing:.14em;font-weight:300}
footer a{text-decoration:none}
.jh-ov{position:fixed;inset:0;z-index:5000;background:#fff;display:none;flex-direction:column;overflow-y:auto;overflow-x:hidden;animation:jhFade .25s ease}
.jh-ov.open{display:flex}
.jh-ov-top{display:grid;grid-template-columns:minmax(0,1fr) auto minmax(0,1fr);align-items:center;padding:16px 32px 20px}
.jh-ov-top img{height:32px;width:auto;display:block}
.jh-ov-stage{flex-grow:1;display:flex;align-items:center;justify-content:center;gap:16px;padding:0 16px;min-height:420px}
.jh-ov-box{position:relative;overflow:hidden;display:flex;align-items:center;justify-content:center;width:min(62vw,640px);height:min(62vh,620px)}
.jh-ov-box.wide{width:min(84vw,1180px)}
.jh-ov-box.tall{height:min(66vh,860px)}
.jh-ov-stage{touch-action:pan-y}
.jh-ov-box img.slide-l{animation:jhSlideL .35s cubic-bezier(.2,.7,.2,1)}
.jh-ov-box img.slide-r{animation:jhSlideR .35s cubic-bezier(.2,.7,.2,1)}
@keyframes jhSlideL{from{transform:translateX(60px);opacity:0}to{transform:none;opacity:1}}
@keyframes jhSlideR{from{transform:translateX(-60px);opacity:0}to{transform:none;opacity:1}}
.jh-ov-box img{max-width:100%;max-height:100%;object-fit:contain;display:block;animation:jhZoom .45s cubic-bezier(.2,.7,.2,1)}
.jh-ov-info{display:flex;flex-direction:column;align-items:center;gap:10px;padding:24px 24px 48px;text-align:center}
.jh-count{font-size:9px;letter-spacing:.14em;color:#555;font-weight:300}
.jh-arrow{all:unset;cursor:pointer;width:62px;height:62px;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.jh-arrow:hover{background:#F2F2F2}
.jh-arrow:focus-visible{outline:2px solid #111}
.jh-arrow[hidden]{display:none}
.jh-wa{display:inline-flex;align-items:center;justify-content:center;min-height:52px;padding:0 30px;margin-top:12px;background:#111;color:#fff;text-decoration:none;font-weight:600;font-size:10px;letter-spacing:.14em}
.jh-wa:hover{background:#F7941D;color:#111}
.jh-icon{position:relative}
.jh-badge{position:absolute;top:6px;right:5px;min-width:15px;height:15px;padding:0 4px;box-sizing:border-box;border-radius:8px;background:#111;color:#fff;font-size:9px;font-weight:600;line-height:15px;text-align:center;display:none}
.jh-badge.on{display:block}
.jh-actions{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;margin-top:12px}
.jh-actions .jh-wa{margin-top:0}
.jh-add{display:inline-flex;align-items:center;justify-content:center;min-height:52px;padding:0 30px;background:#fff;color:#111;border:1px solid #111;cursor:pointer;font:inherit;font-weight:600;font-size:10px;letter-spacing:.14em}
.jh-add:hover{background:#111;color:#fff}
.jh-add.in{border-color:#C8C8C8;color:#555}
.jh-add.in:hover{background:#fff;color:#111;border-color:#111}
.jh-add:focus-visible{outline:2px solid #111;outline-offset:2px}
.jh-sold{display:none;font-size:11px;letter-spacing:.22em;font-weight:600;color:#111;border:1px solid #111;padding:9px 18px;margin-top:6px}
.jh-ov.is-sold .jh-sold{display:inline-block}
.jh-ov.is-sold .jh-actions,.jh-ov.is-sold #ovPrice,.jh-ov.is-sold #ovDetail{display:none}
.jh-cart-bg{position:fixed;inset:0;z-index:5001;background:rgba(255,255,255,.6);opacity:0;visibility:hidden;transition:opacity .4s ease,visibility 0s linear .4s}
.jh-cart-bg.open{opacity:1;visibility:visible;transition:opacity .3s ease,visibility 0s}
.jh-cart{position:fixed;top:0;right:0;bottom:0;z-index:5002;width:min(380px,100vw);background:#fff;border-left:1px solid #C8C8C8;display:flex;flex-direction:column;transform:translateX(100%);transition:transform .42s cubic-bezier(.4,0,.2,1),visibility 0s linear .42s;visibility:hidden}
.jh-cart.open{transform:none;visibility:visible;transition:transform .35s cubic-bezier(.2,.7,.2,1),visibility 0s}
.jh-cart-head{display:flex;justify-content:space-between;align-items:center;padding:14px 12px 14px 20px;border-bottom:1px solid #C8C8C8}
.jh-cart-list{flex:1;overflow-y:auto;padding:8px 20px;margin:0;list-style:none}
.jh-cart-list li{display:grid;grid-template-columns:64px 1fr auto;gap:14px;align-items:center;padding:12px 0;border-bottom:1px solid #EDEDED}
.jh-cart-list .th{width:64px;height:64px;border:1px solid #E2E2E2;display:flex;align-items:center;justify-content:center}
.jh-cart-list .th img{max-width:80%;max-height:80%;object-fit:contain}
.jh-cart-list .nm{display:flex;flex-direction:column;gap:4px;min-width:0}
.jh-cart-list .nm .jh-cap{font-size:9px;white-space:normal}
.jh-cart-list .pr{font-size:10px;letter-spacing:.08em;font-weight:300}
.jh-x{all:unset;cursor:pointer;width:40px;height:40px;display:flex;align-items:center;justify-content:center}
.jh-x:hover{background:#F2F2F2}
.jh-x:focus-visible{outline:2px solid #111}
.jh-cart-empty{padding:40px 20px;font-size:10px;letter-spacing:.12em;color:#555;font-weight:300;text-align:center}
.jh-cart-foot{padding:16px 20px 22px;border-top:1px solid #C8C8C8;display:flex;flex-direction:column;gap:10px}
.jh-cart-foot .jh-wa{margin-top:0;width:100%;box-sizing:border-box}
.jh-cart-foot .jh-wa[aria-disabled="true"]{background:#C8C8C8;pointer-events:none}
.jh-cart-total{display:flex;justify-content:space-between;align-items:baseline;font-size:10px;letter-spacing:.14em;padding-bottom:6px}
.jh-cart-total b{font-size:13px;letter-spacing:.06em;font-weight:600}
.jh-cart-total small{display:block;font-size:8px;letter-spacing:.1em;color:#555;font-weight:300;margin-top:4px}
.jh-cart-note{font-size:9px;letter-spacing:.1em;color:#555;font-weight:300;text-align:center}
/* botones un poco más grandes */
.jh-icon svg{width:23px;height:23px}
.jh-arrow svg{width:26px;height:26px}
.jh-piz-toggle svg{width:20px;height:20px}
.jh-tray-bar svg{width:20px;height:20px}
.jh-x svg{width:18px;height:18px}
.jh-wa,.jh-add{font-size:11px}
.jh-tray-bar .jh-cap{font-size:11px}
.jh-badge{min-width:17px;height:17px;line-height:17px;font-size:10px;border-radius:9px}
@keyframes jhFade{from{opacity:0}to{opacity:1}}
@keyframes jhZoom{from{transform:scale(.82);opacity:0}to{transform:scale(1);opacity:1}}
/* ---- bandeja ARMÁ TU LOOK (solo celular) ---- */
.jh-tray{display:none}
body.is-mobile .jh-tray{display:flex;position:fixed;left:0;right:0;bottom:0;z-index:5;flex-direction:column;background:#fff;border-top:1px solid #C8C8C8;height:52px;transition:height .35s cubic-bezier(.2,.7,.2,1);touch-action:none}
body.is-mobile.look-open .jh-tray{height:62vh}
body.is-mobile.look-full .jh-tray{height:100vh;height:100dvh;border-top:0}
.jh-tray-actions{display:none;flex-direction:column;gap:8px;padding:0 9px 12px;flex-shrink:0}
body.look-full .jh-tray-actions{display:flex}
.jh-tray-actions .jh-wa,.jh-tray-actions .jh-add{margin-top:0;width:100%;box-sizing:border-box;min-height:46px}
.jh-tray-actions .jh-wa[aria-disabled="true"],.jh-tray-actions .jh-add:disabled{opacity:.35;pointer-events:none}
.jh-tray-actions .jh-link{all:unset;cursor:pointer;text-align:center;font-size:9px;letter-spacing:.14em;color:#555;padding:8px;font-weight:300}
.jh-tray-actions .jh-link:focus-visible{outline:2px solid #111}
.jh-swipe{width:36px;height:4px;border-radius:2px;background:#D2D2D2;position:absolute;left:50%;top:6px;transform:translateX(-50%)}
.jh-tray-bar{position:relative}
.jh-tray.dragging{transition:none}
.jh-tray-bar{all:unset;box-sizing:border-box;display:flex;align-items:center;justify-content:space-between;gap:12px;height:52px;padding:0 16px;flex-shrink:0;cursor:pointer}
.jh-tray-bar .jh-cap{font-size:10px}
.jh-tray-bar svg{transition:transform .35s ease}
body.look-open .jh-tray-bar svg{transform:rotate(180deg)}
body.look-full .jh-tray-bar svg{transform:rotate(180deg)}
.jh-tray-area{flex:1;margin:0 9px 9px;border:1px solid #C8C8C8;display:none;position:relative}
body.look-open .jh-tray-area{display:block}
.jh-tray-hint{position:absolute;left:0;right:0;top:45%;text-align:center;font-size:9px;letter-spacing:.12em;color:#8A8A8A;font-weight:300;padding:0 24px}
.jh-tray.hot .jh-tray-bar,body:not(.look-open) .jh-tray.has-items .jh-tray-bar{background:#F7941D}
.jh-toast{position:fixed;left:50%;bottom:72px;transform:translate(-50%,20px);z-index:6000;background:#111;color:#fff;font-size:9px;letter-spacing:.14em;font-weight:600;padding:12px 16px;opacity:0;pointer-events:none;transition:opacity .25s,transform .25s;max-width:calc(100vw - 32px);text-align:center}
.jh-toast.on{opacity:1;transform:translate(-50%,0)}
.jh-tray.hot{border-top-color:#F7941D}
body.look-open .jh-tray.hot .jh-tray-bar{background:#fff}
body.look-open .jh-tray.hot .jh-tray-area{border-color:#111}
body.is-mobile:not(.look-open) .jh-loose:not(.jh-lifted){display:none}
body.is-mobile main{padding-bottom:84px}
/* con la pizarra abierta, la página suma ese alto abajo para poder scrollear hasta la última prenda */
body.is-mobile.look-open main{padding-bottom:calc(62vh + 24px)}
body.is-mobile .jh-cap{white-space:normal;font-size:7px}
@media (max-width:820px){
header,main,footer{padding-left:16px;padding-right:16px}
main{padding-left:16px}
.jh-grid{grid-template-columns:repeat(6,minmax(0,1fr));grid-auto-rows:58px;gap:8px}
.jh-ov-box,.jh-ov-box.wide{width:calc(100vw - 140px)}
/* vista de prenda: todo en una sola pantalla (foto, datos y botones), sin deslizar hacia abajo */
.jh-ov{height:100vh;height:100dvh;overflow:hidden}
.jh-ov-top{padding:10px 16px 6px}
.jh-ov-stage{flex:1 1 0;min-height:0;gap:6px;padding:0 6px}
.jh-ov-box,.jh-ov-box.tall,.jh-ov-box.wide{height:100%;max-height:100%}
.jh-ov-info{gap:6px;padding:10px 16px calc(16px + env(safe-area-inset-bottom))}
.jh-ov-info .jh-actions{flex-wrap:nowrap;width:100%;gap:8px;margin-top:8px}
.jh-ov-info .jh-actions>*{flex:1 1 0;min-width:0;min-height:46px;padding:0 8px;font-size:9px;letter-spacing:.1em;text-align:center}
/* 4 íconos: más angostos para que entren al lado del logo en celulares chicos */
header{gap:6px}
.tools{gap:0}
.jh-icon{width:37px;height:46px}
.jh-icon svg{width:22px;height:22px}
}
</style>
</head>
<body>
<section class="jh-hero" id="hero" aria-label="Editorial JOVENHUESO Vol. 01">
<a class="jh-hero-logo" href="https://www.instagram.com/jovenhueso.revista/" target="_blank" rel="noopener" aria-label="Instagram de JOVENHUESO"><img src="img/logo.png" alt="JOVENHUESO"></a>
<div class="jh-hero-track" id="heroTrack">
<div class="jh-hero-slide"><img class="jh-hero-img" src="revista/rev-03.jpg" alt="Editorial JOVENHUESO Vol. 01 · Look Inter" fetchpriority="high" draggable="false"></div>
<div class="jh-hero-slide"><img class="jh-hero-img" src="revista/rev-06.jpg" alt="Editorial JOVENHUESO Vol. 01 · Look negro" draggable="false"></div>
<div class="jh-hero-slide"><img class="jh-hero-img" src="revista/rev-09.jpg" alt="Editorial JOVENHUESO Vol. 01 · Look blanco" draggable="false"></div>
<div class="jh-hero-slide" aria-hidden="true"><img class="jh-hero-img" src="revista/rev-03.jpg" alt="" draggable="false"></div>
</div>
<button type="button" class="jh-hero-down" id="heroDown" aria-label="Ver el catálogo"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 9l6 6 6-6"/></svg></button>
</section>
<header id="top">
<span></span>
<span></span>

// el botón confirma que la foto quedó guardada (con un tick) y después vuelve a su texto
var markSaved = function () {
var b = document.getElementById('lookPhoto'), txt = b.dataset.txt || (b.dataset.txt = b.textContent);
b.textContent = 'FOTO GUARDADA ✓'; b.classList.add('jh-done'); clearTimeout(b._t);
b._t = setTimeout(function () { b.textContent = txt; b.classList.remove('jh-done'); }, 2600);
};
if (handle) {
handle.createWritable().then(function (w) { return w.write(blob).then(function () { return w.close(); }); })
.then(function () { markSaved(); toast('FOTO DEL LOOK GUARDADA'); }).catch(function () { toast('NO SE PUDO GUARDAR LA FOTO'); });
return;
}
if (!isMobile()) {
var d = document.createElement('a'); d.href = URL.createObjectURL(blob); d.download = 'jovenhueso-look.png';
document.body.appendChild(d); d.click(); setTimeout(function () { URL.revokeObjectURL(d.href); d.remove(); }, 1000); markSaved();
return;
}
var file = new File([blob], 'jovenhueso-look.png', { type: 'image/png' });
if (navigator.canShare && navigator.canShare({ files: [file] })) {
navigator.share({ files: [file], title: 'Mi look JOVENHUESO' }).then(markSaved).catch(function () {});
} else {
var a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = 'jovenhueso-look.png';
document.body.appendChild(a); a.click(); setTimeout(function () { URL.revokeObjectURL(a.href); a.remove(); }, 1000); markSaved();
}
}, 'image/png');
}
document.getElementById('pizToggle').addEventListener('click', function () {
var open = !pizL.classList.contains('menu-open');
pizL.classList.toggle('menu-open', open); this.setAttribute('aria-expanded', open ? 'true' : 'false');
pizL.style.zIndex = open ? String(++z) : ''; // abierto, el menú queda por encima de las prendas
});
document.getElementById('lookPhoto').addEventListener('click', function () {
if (!lookIds().length) return;
if (!isMobile() && window.showSaveFilePicker) {
// en compu se pide dónde guardarla (ventana "Guardar como")
window.showSaveFilePicker({ suggestedName: 'jovenhueso-look.png', types: [{ description: 'Imagen PNG', accept: { 'image/png': ['.png'] } }] })
.then(function (handle) { lookPhoto(handle); })
.catch(function () {});

document.getElementById('lookClear').addEventListener('click', function () { clearLoose(true); updateTray(); setLookFull(false); });
function overTray(x, y) { var r = tray.getBoundingClientRect(); return x >= r.left && x <= r.right && y >= r.top && y <= r.bottom; }
function placeInTray(id) {
// deja la prenda dentro de la pizarra (si se soltó sobre la barra, va al centro)
var a = trayArea.getBoundingClientRect(), f = free[id], el = loose[id];
var nx = Math.min(Math.max(f.x, a.left + 6), a.right - f.w - 6), ny = Math.min(Math.max(f.y, a.top + 6), a.bottom - f.h - 6);
if (f.y < a.top) { nx = a.left + (a.width - f.w) / 2; ny = a.top + (a.height - f.h) / 2; }
f.x = nx; f.y = ny; el.style.left = nx + 'px'; el.style.top = ny + 'px';
f.rx = nx - a.left; f.ry = ny - a.top; // posición dentro de la pizarra
}
// reubica las prendas según la pizarra (su alto cambia cuando el navegador del celular muestra u oculta su barra)
// center: el look entero (como grupo, sin desarmarlo) queda centrado en la pizarra; se usa al agrandar o achicar la bandeja
function syncTray(center) {
var a;
if (isMobile()) { if (!document.body.classList.contains('look-open')) return; a = trayArea.getBoundingClientRect(); }
else { if (!pizL.classList.contains('on')) return; a = pizL.getBoundingClientRect(); }
var ids = Object.keys(loose).filter(function (id) { return free[id].rx !== undefined && !(p && p.active && p.id === id); });
var dx = 0, dy = 0;
if (center && ids.length) {
var x0 = Infinity, y0 = Infinity, x1 = -Infinity, y1 = -Infinity;
ids.forEach(function (id) { var f = free[id]; x0 = Math.min(x0, f.rx); y0 = Math.min(y0, f.ry); x1 = Math.max(x1, f.rx + f.w); y1 = Math.max(y1, f.ry + f.h); });
var gw = x1 - x0, gh = y1 - y0;
dx = gw < a.width ? (a.width - gw) / 2 - x0 : 6 - x0;
dy = gh < a.height ? (a.height - gh) / 2 - y0 : 6 - y0;
}
ids.forEach(function (id) {
var f = free[id], el = loose[id];
f.x = a.left + f.rx + dx; f.y = center ? a.top + f.ry + dy : Math.min(a.top + f.ry, a.bottom - f.h * 0.5);
el.style.left = f.x + 'px'; el.style.top = f.y + 'px';
});
return { dx: dx, dy: dy, ids: ids };
}
// compu: al soltar una prenda sobre la pizarra queda anclada a ella; fuera de la pizarra queda fija en la pantalla
function anchorToPizarra(id) {
var f = free[id]; if (!f) return;
var pr = pizL.getBoundingClientRect(), cx = f.x + f.w / 2, cy = f.y + f.h / 2;
if (pizL.classList.contains('on') && cx >= pr.left && cx <= pr.right && cy >= pr.top && cy <= pr.bottom) { f.rx = f.x - pr.left; f.ry = f.y - pr.top; }
else { delete f.rx; delete f.ry; }
}
function followTray(ms, center) {
var end = Date.now() + ms;
(function step() {
var r = syncTray(center);
if (Date.now() < end) requestAnimationFrame(step);
else if (center && r) r.ids.forEach(function (id) { free[id].rx += r.dx; free[id].ry += r.dy; }); // queda centrado para lo que sigue
})();
}
window.addEventListener('resize', function () { syncTray(); });
window.addEventListener('scroll', function () { syncTray(); }, { passive: true });

var p = null, holdTimer = null, openTimer = null;
board.addEventListener('pointerdown', function (e) {
if (e.button !== 0) return;
var el = hitTest(e.clientX, e.clientY);
if (!el) return;
p = { id: el.getAttribute('data-jh-id'), el: el, x0: e.clientX, y0: e.clientY, active: false, touch: e.pointerType === 'touch' };
clearTimeout(holdTimer);
if (p.touch && el.classList.contains('jh-loose')) { e.preventDefault(); lift(p.x0, p.y0); }
else if (p.touch) holdTimer = setTimeout(function () { if (p && !p.cancelled) lift(p.x0, p.y0); }, 320);
});
function lift(x, y) {
// se mide la prenda ANTES de convertirla en ficha suelta, así sale exactamente desde donde está el dedo
var el, rect;
if (p.el.classList.contains('jh-loose')) { el = p.el; rect = el.getBoundingClientRect(); }
else {
var im = p.el.querySelector(flipped && BY[p.id].b ? '.jh-back img' : '.jh-face:not(.jh-back) img');
rect = im.getBoundingClientRect();
el = makeLoose(p.id, rect);
}
p.dx = x - rect.left; p.dy = y - rect.top; p.active = true; p.loose = el;
el.style.zIndex = ++z; el.classList.add('jh-lifted');
cards[p.id].classList.add('jh-home');
if (p.touch && navigator.vibrate) { try { navigator.vibrate(12); } catch (err) {} }
if (el.animate) el.animate([{ transform: 'scale(1)' }, { transform: 'scale(1.08)' }, { transform: 'scale(1)' }], { duration: 260, easing: 'ease-out' });
}
window.addEventListener('pointermove', function (e) {
if (!p) return;
if (!p.active) {
var dist = Math.abs(e.clientX - p.x0) + Math.abs(e.clientY - p.y0);
if (p.touch) { if (dist > 10) { p.cancelled = true; clearTimeout(holdTimer); } return; }
if (dist < 5) return;
lift(p.x0, p.y0);
}
var f = free[p.id];
// la ficha se mueve por toda la pantalla y queda fija mientras se scrollea
var vw = document.documentElement.clientWidth, vh = window.innerHeight;
var nx = Math.max(-f.w * 0.6, Math.min(vw - f.w * 0.4, e.clientX - p.dx));
var ny = Math.max(-f.h * 0.3, Math.min(vh - f.h * 0.5, e.clientY - p.dy));
f.x = nx; f.y = ny; p.loose.style.left = nx + 'px'; p.loose.style.top = ny + 'px';
var hr = cards[p.id].getBoundingClientRect();
p.home = e.clientX >= hr.left && e.clientX <= hr.right && e.clientY >= hr.top && e.clientY <= hr.bottom;
cards[p.id].classList.toggle('hot', p.home);
if (isMobile()) {
// al bajar la prenda hacia la bandeja, la pizarra se despliega sola para soltarla donde quieras
if (!document.body.classList.contains('look-open') && e.clientY > window.innerHeight - 140) { setLookOpen(true); p.autoOpened = true; }
p.tray = overTray(e.clientX, e.clientY);
tray.classList.toggle('hot', p.tray);
// si el lugar original de la prenda queda tapado por la pizarra, manda la pizarra: no vuelve a su lugar
if (p.tray) { p.home = false; cards[p.id].classList.remove('hot'); }
}
});
window.addEventListener('touchmove', function (e) { if (p && p.active) e.preventDefault(); }, { passive: false });
function up() {
clearTimeout(holdTimer);
if (!p) return;
var q = p; p = null;
if (q.active) {
q.loose.classList.remove('jh-lifted');
cards[q.id].classList.remove('jh-home', 'hot');
if (q.home) { returnHome(q.id, true); updateTray(); return; }
if (!isMobile()) { anchorToPizarra(q.id); updateTray(); }
if (isMobile()) {
tray.classList.remove('hot');
if (q.tray) {
if (!document.body.classList.contains('look-open')) { setLookOpen(true); setTimeout(function () { if (loose[q.id]) placeInTray(q.id); }, 380); }
else placeInTray(q.id);
} else {
returnHome(q.id, true);
// si la pizarra se abrió sola y quedó vacía, se vuelve a cerrar
if (q.autoOpened && !Object.keys(loose).length) setLookOpen(false);
}
updateTray();
}
return;
}
if (q.cancelled) return;
// en una prenda suelta esperamos un instante por si es doble clic (volver a su lugar)
if (q.el.classList.contains('jh-loose')) { clearTimeout(openTimer); openTimer = setTimeout(function () { openItem(q.id); }, 260); }
else openItem(q.id);
}
window.addEventListener('pointerup', up);
window.addEventListener('pointercancel', up);

// ---- vista de prenda
var ov = document.getElementById('ov'), ovBox = document.getElementById('ovBox'), cur = null, side = 0;
function renderOv() {
var x = BY[cur], imgs = x.pages || (x.b ? [x.f, x.b] : [x.f]), n = imgs.length, k = ((side % n) + n) % n;
ovBox.className = 'jh-ov-box' + (x.revista ? ' tall' : '') + (x.revista && k > 0 && k < n - 1 ? ' wide' : '');
ovBox.innerHTML = '<img src="' + imgs[k] + '" alt="' + esc(x.name + ' by ' + x.brand) + '" draggable="false">';
document.getElementById('ovPrev').hidden = n < 2; document.getElementById('ovNext').hidden = n < 2;
var pad = function (v) { return (v < 10 ? '0' : '') + v; };
document.getElementById('ovCount').textContent = x.revista ? pad(k + 1) + ' / ' + pad(n) : '';
document.getElementById('ovName').innerHTML = cap(x);
document.getElementById('ovPrice').textContent = x.price;
document.getElementById('ovDetail').textContent = x.revista ? 'FORMATO A4 · EDICIÓN IMPRESA' : x.measures;
setConsult(document.getElementById('ovWa'), 'Hola JOVENHUESO! Me interesa ' + x.name + ' by ' + x.brand + ' (' + x.price.toLowerCase() + (x.measures ? ' · ' + x.measures.toLowerCase() : '') + '). ¿Sigue disponible?');
ov.setAttribute('aria-label', x.name + ' by ' + x.brand + (x.sold ? ' — vendido' : ''));
ov.classList.toggle('is-sold', !!x.sold);
syncAddBtn();
}
function openItem(id) { cur = id; side = flipped && BY[id].b ? (BY[id].pages ? BY[id].pages.length - 1 : 1) : 0; // si el catálogo está dado vuelta, se abre mostrando la espalda (la revista, en la contratapa)
 if (ovClosing) { ovClosing.cancel(); ovClosing = null; }
 renderOv(); ov.classList.add('open'); document.getElementById('ovClose').focus(); }
// cierre suave: el inverso de la apertura (la prenda se achica un poco y todo se desvanece)
var ovClosing = null;
document.getElementById('ovClose').addEventListener('click', function () {
if (!ov.classList.contains('open') || ovClosing) return;
var back = cards[cur];
if (!ov.animate) { ov.classList.remove('open'); if (back) back.focus(); return; }
var im = ov.querySelector('.jh-ov-box img');
if (im) im.animate([{ transform: 'scale(1)', opacity: 1 }, { transform: 'scale(.88)', opacity: 0 }], { duration: 340, easing: 'cubic-bezier(.4,0,.6,1)', fill: 'forwards' });
ovClosing = ov.animate([{ opacity: 1 }, { opacity: 0 }], { duration: 380, easing: 'ease-in-out', fill: 'forwards' });
ovClosing.onfinish = function () { ov.classList.remove('open'); ovClosing.cancel(); ovClosing = null; if (back) back.focus({ preventScroll: true }); };
});
function stepOv(d) {
var x = BY[cur], n = (x.pages || (x.b ? [x.f, x.b] : [x.f])).length;
if (n < 2) { var i0 = ovBox.querySelector('img'); if (i0) i0.style.transform = ''; return; }
// deslizamiento dentro del recuadro (entre las flechas): la imagen actual sale por un costado y la nueva entra por el otro, recortadas por el recuadro
var old = ovBox.querySelector('img'), r = old && old.getBoundingClientRect(), from = (arguments[1] || 0);
var gw = r && r.width, gh = r && r.height, gsrc = old && old.getAttribute('src');
side += d; renderOv();
var im = ovBox.querySelector('img'), W = ovBox.clientWidth + 24, T = { duration: 520, easing: 'cubic-bezier(.65,0,.35,1)', fill: 'both' };
if (im) im.style.animation = 'none'; // sin el zoom de apertura al pasar
if (gw && ovBox.animate) {
var ghost = document.createElement('img'); ghost.src = gsrc; ghost.alt = '';
ghost.style.cssText = 'position:absolute;left:50%;top:50%;width:' + gw + 'px;height:' + gh + 'px;margin:' + (-gh / 2) + 'px 0 0 ' + (-gw / 2) + 'px;max-width:none;max-height:none;pointer-events:none;animation:none';
ovBox.appendChild(ghost);
var g = ghost.animate([{ transform: 'translateX(' + from + 'px)' }, { transform: 'translateX(' + (-d * W) + 'px)' }], T);
g.onfinish = function () { ghost.remove(); };
}
if (im && im.animate) { var a = im.animate([{ transform: 'translateX(' + (d * W + from) + 'px)' }, { transform: 'translateX(0)' }], T); a.onfinish = function () { a.cancel(); }; }
}
document.getElementById('ovPrev').addEventListener('click', function () { stepOv(-1); });
document.getElementById('ovNext').addEventListener('click', function () { stepOv(1); });
// deslizar el dedo a la derecha o izquierda sobre la prenda cambia entre frente y espalda (o pasa las hojas de la revista)
(function () {
var stage = document.querySelector('.jh-ov-stage'), sw = null;
// sin esto, al arrastrar la foto con el mouse el navegador la "agarra" (arrastrar y soltar) y cancela el deslizamiento
stage.addEventListener('dragstart', function (e) { e.preventDefault(); });
stage.addEventListener('pointerdown', function (e) {
if (e.target.closest('.jh-arrow')) return;
sw = { x0: e.clientX, y0: e.clientY, dx: 0 };
});
stage.addEventListener('pointermove', function (e) {
if (!sw) return;
sw.dx = e.clientX - sw.x0;
var im = ovBox.querySelector('img');
if (im && Math.abs(sw.dx) > Math.abs(e.clientY - sw.y0)) { im.style.transform = 'translateX(' + sw.dx + 'px)'; }
});
function end() {
if (!sw) return;
var dx = sw.dx; sw = null;
var im = ovBox.querySelector('img');
if (dx < -45 || dx > 45) { stepOv(dx < 0 ? 1 : -1, dx); return; } // la nueva entra desde donde quedó el arrastre
if (im) { im.style.transform = ''; if (dx && im.animate) im.animate([{ transform: 'translateX(' + dx + 'px)' }, { transform: 'translateX(0)' }], { duration: 300, easing: 'cubic-bezier(.2,.7,.2,1)' }); }
}
stage.addEventListener('pointerup', end);
stage.addEventListener('pointercancel', end);
stage.addEventListener('pointerleave', end);
})();

// ---- carrito: se guarda en este navegador, para no perderlo al recargar
var cart = [];
try { cart = JSON.parse(localStorage.getItem('jh-cart') || '[]').filter(function (id) { return BY[id] && !BY[id].sold; }); } catch (err) { cart = []; }
function saveCart() { try { localStorage.setItem('jh-cart', JSON.stringify(cart)); } catch (err) {} }
var cartEl = document.getElementById('cart'), cartBg = document.getElementById('cartBg');
function markCart() {
// puntito naranja en el recuadro de las prendas que están en el carrito
ORDER.forEach(function (id) { cards[id].classList.toggle('jh-incart', cart.indexOf(id) >= 0); });
document.getElementById('cartBtn').classList.toggle('full', cart.length > 0);
}
function renderCart() {
markCart();
var n = cart.length, badge = document.getElementById('cartCount');
badge.textContent = n; badge.classList.toggle('on', n > 0);
document.getElementById('cartBtn').setAttribute('aria-label', 'Abrir carrito (' + n + (n === 1 ? ' prenda)' : ' prendas)'));
document.getElementById('cartTitleCount').textContent = n ? '(' + n + ')' : '';
var list = document.getElementById('cartList');
if (!n) { list.innerHTML = '<li class="jh-cart-empty" style="display:block;border:0">TU CARRITO ESTÁ VACÍO.<br><br>ABRÍ UNA PRENDA Y TOCÁ “AGREGAR AL CARRITO”.</li>'; }
else list.innerHTML = cart.map(function (id) {
var x = BY[id];
return '<li><div class="th"><img src="' + x.f + '" alt=""></div><div class="nm"><span class="jh-cap">' + cap(x) + '</span><span class="pr">' + esc(x.price) + '</span></div>' +
'<button type="button" class="jh-x" data-rm="' + id + '" aria-label="Quitar ' + esc(x.name + ' by ' + x.brand) + ' del carrito"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#111" stroke-width="1.4" aria-hidden="true"><path d="M5 5l14 14M19 5L5 19"/></svg></button></li>';
}).join('');
// total del carrito (las prendas sin precio cargado se aclaran aparte)
var total = 0, sinPrecio = 0;
cart.forEach(function (id) { var v = parseInt(String(BY[id].price).replace(/[^0-9]/g, ''), 10); if (v) total += v; else sinPrecio++; });
var tot = document.getElementById('cartTotal');
tot.style.display = n ? '' : 'none';
tot.innerHTML = '<span>TOTAL' + (sinPrecio ? '<small>+ ' + sinPrecio + (sinPrecio === 1 ? ' PRENDA' : ' PRENDAS') + ' A CONSULTAR</small>' : '') + '</span><b>$ ' + total.toLocaleString('es-AR') + '</b>';
var wa = document.getElementById('cartWa');
if (n) {
var msg = 'Hola JOVENHUESO! Me interesan estas prendas, ¿siguen disponibles?\n' + cart.map(function (id) { var x = BY[id]; return '- ' + x.name + ' by ' + x.brand + ' (' + x.price.toLowerCase() + ')'; }).join('\n') + '\nTotal: $ ' + total.toLocaleString('es-AR');
setConsult(wa, msg); wa.removeAttribute('aria-disabled'); wa.removeAttribute('tabindex');
} else { wa.href = '#'; wa.setAttribute('aria-disabled', 'true'); wa.setAttribute('tabindex', '-1'); }
if (cur) syncAddBtn();
if (typeof updateTray === 'function') updateTray();
}
function syncAddBtn() {
var b = document.getElementById('ovAdd'), inCart = cart.indexOf(cur) >= 0;
b.classList.toggle('in', inCart);
b.textContent = inCart ? 'EN EL CARRITO ✓  QUITAR' : 'AGREGAR AL CARRITO';
}
document.getElementById('ovAdd').addEventListener('click', function () {
var i = cart.indexOf(cur);
var im = ovBox.querySelector('img');
if (i >= 0) { cart.splice(i, 1); saveCart(); renderCart(); if (im && im.getAnimations) im.getAnimations().forEach(function (an) { an.cancel(); }); return; }
cart.push(cur); saveCart(); renderCart();
// la prenda se esfuma en su lugar y la vista queda abierta (vacía) hasta que se cierre a mano
var cb = document.getElementById('cartBtn'); cb.classList.remove('pop'); void cb.offsetWidth; cb.classList.add('pop');
if (!im || !im.animate) return;
im.animate([
{ opacity: 1, filter: 'blur(0px)' },
{ opacity: 0, filter: 'blur(6px)' }
], { duration: 600, easing: 'cubic-bezier(.4,0,.2,1)', fill: 'forwards' });
});
document.getElementById('cartList').addEventListener('click', function (e) {
var b = e.target.closest('[data-rm]'); if (!b) return;
cart.splice(cart.indexOf(b.getAttribute('data-rm')), 1); saveCart(); renderCart();
});
function openCart() { renderCart(); cartEl.classList.add('open'); cartBg.classList.add('open'); document.getElementById('cartClose').focus(); }
function closeCart() { cartEl.classList.remove('open'); cartBg.classList.remove('open'); document.getElementById('cartBtn').focus(); }
document.getElementById('cartBtn').addEventListener('click', openCart);
document.getElementById('cartClose').addEventListener('click', closeCart);
cartBg.addEventListener('click', closeCart);
document.addEventListener('keydown', function (e) {
if (e.key !== 'Escape') return;
if (cartEl.classList.contains('open')) closeCart();
else if (ov.classList.contains('open')) document.getElementById('ovClose').click();
});
renderCart();

layout();
setRows();
placePizarras();
applyScale();
})();
</script>
